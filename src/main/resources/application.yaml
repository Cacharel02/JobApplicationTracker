jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
spring:
  application:
    name: JobApplicationTracker
  datasource:
    url: jdbc:postgresql://localhost:5432/job_tracker
    username: job_tracker_user
    password: jobtrackerpswd
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: optional:file:.env[.properties]
